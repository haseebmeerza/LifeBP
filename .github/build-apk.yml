name: Build APK
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm install
      - run: node build.js
      - run: npx cap add android
      - run: node patch-android.js
      - run: npx cap sync android
      - run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
      - name: Sign APK
        env:
          KS_B64: ${{ secrets.KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          set -e
          test -n "$KS_B64" || { echo "Add secrets KEYSTORE_B64 and KEYSTORE_PASSWORD first (see README step 3)"; exit 1; }
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/ks.jks"
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          UNS=$(find android/app/build/outputs/apk/release -name "*.apk" | head -1)
          VER=$(node -p "require('./app.config.json').versionName")
          "$BT/zipalign" -p -f 4 "$UNS" aligned.apk
          "$BT/apksigner" sign --ks "$RUNNER_TEMP/ks.jks" --ks-key-alias lifebp --ks-pass env:KS_PASS --key-pass env:KS_PASS --out "Life-BP-v$VER.apk" aligned.apk
          "$BT/apksigner" verify "Life-BP-v$VER.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: Life-BP-APK
          path: Life-BP-v*.apk
