name: Create Keystore (run once)
on:
  workflow_dispatch:
jobs:
  keystore:
    runs-on: ubuntu-latest
    steps:
      - run: |
          PASS=$(openssl rand -hex 12)
          keytool -genkeypair -keystore lifebp.jks -alias lifebp -keyalg RSA -keysize 2048 -validity 10000 -storepass "$PASS" -keypass "$PASS" -dname "CN=Haseeb Mirza, O=Life Pharmacy, C=AE"
          base64 -w0 lifebp.jks > keystore_b64.txt
          echo "$PASS" > keystore_password.txt
      - uses: actions/upload-artifact@v4
        with:
          name: keystore
          path: |
            lifebp.jks
            keystore_b64.txt
            keystore_password.txt
