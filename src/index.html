<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0b7a4b">
<title>Life Pharmacy Vital Record (Walkin)</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f1f5f3;color:#1c2b25;min-height:100vh;display:flex;flex-direction:column}
header{background:#0b7a4b;color:#fff;text-align:center;padding:14px 10px;font-size:18px;font-weight:bold}
nav{display:flex;background:#fff;border-bottom:2px solid #d5e3dc}
nav button{flex:1;padding:12px;border:0;background:none;font-size:15px;font-weight:bold;color:#55695f}
nav button.on{color:#0b7a4b;border-bottom:3px solid #0b7a4b}
main{flex:1;padding:12px;max-width:640px;width:100%;margin:0 auto}
.card{background:#fff;border-radius:10px;padding:14px;margin-bottom:12px;box-shadow:0 1px 4px #0002}
label{display:block;font-size:13px;font-weight:bold;margin:10px 0 4px}
input,select,textarea{width:100%;padding:10px;border:1px solid #bcccc4;border-radius:8px;font-size:16px}
.row{display:flex;gap:8px}.row>*{flex:1}
button.b{padding:12px;border:0;border-radius:8px;background:#0b7a4b;color:#fff;font-size:16px;font-weight:bold;width:100%;margin-top:12px}
button.s{background:#2d6cdf}button.g{background:#25a244}button.r{background:#c0392b}button.o{background:#6b7b73}
.small{padding:8px 10px;font-size:14px;width:auto;margin:4px 4px 0 0}
.v{border-bottom:1px solid #e3ece7;padding:10px 0;cursor:pointer}
.tag{display:inline-block;padding:1px 7px;border-radius:10px;font-size:12px;color:#fff;background:#25a244}
.tag.High,.tag.Low{background:#c0392b}.tag.Elevated{background:#e08a00}
table{width:100%;border-collapse:collapse;font-size:13px}
td,th{border:1px solid #d5e3dc;padding:5px;text-align:left}
.hide{display:none}
#toast{position:fixed;bottom:70px;left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:10px 16px;border-radius:20px;opacity:0;transition:.3s;pointer-events:none;max-width:90%;text-align:center}
#toast.on{opacity:1}
footer{background:#fff;border-top:2px solid #d5e3dc;text-align:center;font-size:12px;padding:10px;color:#55695f}
footer a{color:#0b7a4b;font-weight:bold;text-decoration:none}
.pr{display:none}
.vb{text-align:right;padding:5px 12px;font-size:13px;background:#e6efe9}.vb a{color:#0b7a4b;font-weight:bold;text-decoration:none}
.desk main{max-width:900px}.desk .card{padding:22px}.desk .row{gap:18px}.desk nav{justify-content:center}.desk nav button{max-width:240px}
footer{display:flex;align-items:center;justify-content:center;gap:12px;text-align:left}.ubar{background:#fff3cd;padding:10px 14px;font-size:14px;border-bottom:2px solid #e0a800}.ovl{position:fixed;top:0;left:0;right:0;bottom:0;background:#fffffff5;z-index:99;padding:50px 22px;text-align:center;font-size:16px}footer img{width:56px;height:56px;border-radius:8px;flex:none}
@media print{header,nav,footer,main>section,#toast{display:none!important}.pr{display:block!important}body{background:#fff}}
</style>
</head>
<body>
<div id="upd" class="hide"></div>
<header>Life Pharmacy Vital Record (Walkin)</header>
<div class="vb"><a href="#" id="vt" onclick="toggleView();return false">Switch to Desktop view</a></div>
<nav>
<button id="t1" class="on" onclick="tab(1)">New Record</button>
<button id="t2" onclick="tab(2)">Reports</button>
<button id="t3" onclick="tab(3)">Settings</button>
</nav>
<main>
<section id="p1">
<div class="card">
<div class="row">
<div><label>Date</label><input type="date" id="d"></div>
<div><label>Time</label><input type="time" id="tm"></div>
</div>
<label>Visitor Name *</label><input id="nm" placeholder="Full name" autocomplete="off">
<label>Mobile No (WhatsApp) *</label><input id="mb" type="tel" placeholder="05XXXXXXXX or 9715XXXXXXXX">
<div class="row">
<div><label>BP Systolic</label><input id="sy" type="number" inputmode="numeric" placeholder="120"></div>
<div><label>BP Diastolic</label><input id="di" type="number" inputmode="numeric" placeholder="80"></div>
</div>
<div class="row">
<div><label>Heartbeat (bpm)</label><input id="hr" type="number" inputmode="numeric" placeholder="72"></div>
<div><label>Sugar (mg/dL)</label><input id="su" type="number" inputmode="numeric" placeholder="110"></div>
</div>
<label>Sugar Type</label>
<select id="st"><option>Random</option><option>Fasting</option><option>After meal</option></select>
<label>Note (optional)</label><input id="nt" placeholder="e.g. on medication">
<label style="font-weight:normal"><input type="checkbox" id="wa" checked style="width:auto"> Send report to visitor's WhatsApp after saving</label>
<button class="b" onclick="save()">Save Record</button>
</div>
</section>

<section id="p2" class="hide">
<div class="card">
<input id="q" placeholder="Search name or mobile" oninput="list()">
<div class="row"><div><label>From</label><input type="date" id="f1" onchange="list()"></div><div><label>To</label><input type="date" id="f2" onchange="list()"></div></div>
<div id="vl"></div>
</div>
<div id="vd" class="card hide"></div>
</section>

<section id="p3" class="hide">
<div class="card">
<div id="urlbox"><label>Google Sheet Web App URL</label>
<input id="url" placeholder="https://script.google.com/macros/s/.../exec">
<button class="b" onclick="saveUrl()">Save URL</button></div>
<button class="b s" onclick="syncAll()">Sync Pending to Google Sheet</button>
<button class="b o" onclick="restore()">Restore from Google Sheet</button>
<button class="b g" onclick="csv()">Download All (CSV)</button>
<button class="b s" onclick="chkUpd(true)">Check for Updates</button>
<p id="info" style="font-size:13px"></p>
</div>
</section>

<div id="pr" class="pr"></div>
</main>
<div id="toast"></div>
<footer>
<img src="logo.png" alt="Haseeb Mirza">
<div>Developed by <b>Haseeb Mirza</b> <a href="tel:+971507256801">+971507256801</a><br>
&copy; All rights reserved. No part of this app may be republished or copied.</div>
</footer>

<script src="app.js"></script>
</body>
</html>
